<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.url == "/" %}{{ site.title }} | {{ site.description }}{% else %}{{ page.title }} | {{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪙</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/penny.css' | relative_url }}">
</head>
<body>

<nav class="nav">
  <div class="wrap">
    <a class="wordmark" href="{{ '/' | relative_url }}">🪙 Penny<span>.</span></a>
    <a href="{{ '/#install' | relative_url }}">Install</a>
    <a href="{{ '/how-penny-works.html' | relative_url }}">How it works</a>
    <a href="https://github.com/alexander-caldwell/penny">GitHub</a>
  </div>
</nav>

{{ content }}

<footer>
  <div class="wrap">
    <div class="links">
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/how-penny-works.html' | relative_url }}">How Penny works</a>
      <a href="https://github.com/alexander-caldwell/penny#readme">README</a>
      <a href="https://github.com/alexander-caldwell/penny/issues">Issues</a>
    </div>
    <p>Built by <a href="https://github.com/alexander-caldwell">Alex Caldwell</a> at <a href="https://rittmananalytics.com">Rittman Analytics</a>. MIT licensed.</p>
  </div>
</footer>

</body>
</html>
