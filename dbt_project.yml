name: 'penny'
version: '1.0.0'
config-version: 2

# Lower bound is 1.10.5, the first version with the `arguments:` property that
# this project's generic tests use. Upper bound is <3.0.0, not <2.0.0, so the
# Fusion engine (which reports as v2) does not flag Penny as an incompatible
# package; dbt Labs ask package authors to include 2.0.0 in this range to
# declare Fusion compatibility. Fusion itself is untested against Penny.
require-dbt-version: [">=1.10.5", "<3.0.0"]

# ── Paths ──────────────────────────────────────────────────────────────────
model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
clean-targets: ["target", "dbt_packages"]

# ── Configuration variables ──────────────────────────────────────────────────
# Override any of these in the consumer project's dbt_project.yml under `vars:`.
vars:
  # The BigQuery project and region whose INFORMATION_SCHEMA.JOBS Penny reads.
  # Leave null to auto-detect from the dbt target (target.project /
  # target.location) — the common case needs no config here. Set them only to
  # read a project/region other than the one dbt is connected to. The region is
  # the multi-region or region location, e.g. 'region-EU' or 'region-us'.
  penny_bigquery_project: null
  penny_bigquery_region: null

  # Pricing mode:
  #   'auto'      — per job: on-demand when reservation_id is null, slot-based
  #                 when the job ran in a reservation (handles mixed projects)
  #   'on_demand' — force bytes-billed pricing for every job
  #   'editions'  — force slot-based pricing for every job
  penny_pricing_model: "auto"

  # On-demand pricing: USD per TiB billed (current BigQuery on-demand rate).
  penny_price_per_tb: 6.25

  # Slot-based pricing: USD per slot-hour. Used for reserved jobs in 'auto' mode
  # and for every job in 'editions' mode. Set to your effective edition rate.
  penny_price_per_slot_hour: 0.04

  # Initial lookback window (days) used on first build / full refresh.
  # Incremental runs only read partitions newer than the current max partition.
  penny_lookback_days: 180

  # Restrict ingestion to dbt-labelled jobs only (recommended).
  penny_dbt_only: true

  # Optional: restrict to a single dbt project — the root project that ran dbt,
  # not the package a model is defined in, so Penny's own models count as part
  # of your project. Matched against the dbt_project_name job label, falling
  # back to the node-id prefix for jobs that predate that label (see
  # penny_project_filter). null = no filter.
  penny_dbt_project_filter: null

  # Optional: your dbt project name. Only used when Penny falls back to the
  # standard `node_id` job label (emitted by dbt's default query-comment with
  # job-label: true). BigQuery sanitises that label to `model_<project>_<name>`,
  # so setting this lets Penny strip the `model_<project>_` prefix back off for
  # clean, classifiable model names. Leave null and Penny still groups correctly
  # by node id — the names are just prefixed. null = no stripping.
  penny_dbt_project_name: null

  # Anomaly threshold multiplier — a model's daily cost is flagged when it
  # exceeds this multiple of its trailing 30-day average.
  penny_anomaly_threshold: 3

# ── Model configuration ──────────────────────────────────────────────────────
# Materialisations for staging/integration are set in-model (they need
# partition_by + insert_overwrite). Here we set the shared schema and tags so
# all Penny objects land together in one dataset.
models:
  penny:
    +schema: penny
    staging:
      +tags: ["penny", "penny_staging"]
    integration:
      +tags: ["penny", "penny_integration"]
    analytics:
      +materialized: table
      +tags: ["penny", "penny_analytics"]

seeds:
  penny:
    +schema: penny
    penny_bigquery_pricing:
      +column_types:
        price_usd: float64
        effective_date: date

# ── Run summary hook ──────────────────────────────────────────────────────────
# Deliberately NOT registered here. dbt runs on-run-end hooks from installed
# packages too, so a hook in this file would double-fire alongside the consumer's
# own registration. Consumer projects register it themselves (see README):
#
#   on-run-end:
#     - "{{ penny.log_run_costs() }}"

# ── Flags ─────────────────────────────────────────────────────────────────────
# Generic test arguments in this project's .yml files are nested under
# `arguments:`, which dbt 1.10.5+ and Fusion expect. This flag only takes effect
# when Penny is the root project (i.e. when developing Penny itself) — dbt reads
# flags from the root project only, so it is inert for consumers. Consumers on
# dbt 1.10.x may want to set the same flag in their own dbt_project.yml.
flags:
  require_generic_test_arguments_property: true
