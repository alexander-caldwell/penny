packages:
  # dbt_utils powers two tests: recency (staging freshness) and
  # unique_combination_of_columns (report grains). Pinned wide so Penny coexists
  # with whatever the consumer already ships — both macros are present from
  # dbt_utils 0.8.0 onward.
  - package: dbt-labs/dbt_utils
    version: [">=0.8.0", "<2.0.0"]
