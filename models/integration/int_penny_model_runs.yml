version: 2

models:
  - name: int_penny_model_runs
    description: >
      One row per dbt model execution (one BigQuery job), enriched with cost in
      USD, methodology-layer classification, and derived size/error metrics.
      Cost is computed by the shared penny.get_cost_usd macro using the pricing
      mode set in penny_pricing_model. Free tier is not netted out — gross cost.
    columns:
      - name: job_id
        description: BigQuery job id (grain).
        tests:
          - not_null
          - unique
      - name: created_at
        description: Job creation timestamp. Partition key.
        tests:
          - not_null
      - name: run_date
        description: Calendar date of the run, derived from created_at.
        tests:
          - not_null
      - name: completed_at
        description: Job end timestamp.
      - name: dbt_invocation_id
        description: dbt invocation id grouping all jobs from one dbt run.
      - name: dbt_node_id
        description: >
          dbt node unique id. Penny's dbt_node_id label when configured, else the
          standard node_id label from dbt's default job-label query comment
          (BigQuery sanitises dots to underscores in either case).
      - name: model_name
        description: >
          Model identity, in preference order: dbt_model_name label, then the
          node_id label with its resource/project prefix stripped, then the
          destination table name, then 'unknown' for jobs that write nowhere
          (introspection, hooks, package operations). The trailing __dbt_tmp
          incremental suffix is stripped so temp-build jobs fold into their
          model. Never null.
      - name: is_label_fallback
        description: True when model_name was derived from the destination table because no dbt_model_name label was present.
      - name: methodology_layer
        description: >
          Rittman Analytics layer inferred from the model-name prefix:
          staging (stg_), integration (int_), warehouse (dim_/fct_),
          analytics (rpt_/mtr_), or unclassified.
        tests:
          - not_null
          - accepted_values:
              values: ['staging', 'integration', 'warehouse', 'analytics', 'unclassified']
      - name: execution_time_seconds
        description: Wall-clock execution time in seconds.
      - name: total_bytes_processed
        description: Total bytes processed by the job.
      - name: total_bytes_billed
        description: Total bytes billed — basis for on-demand cost.
      - name: gb_billed
        description: total_bytes_billed expressed in GiB, rounded to 4 dp.
      - name: tb_billed
        description: total_bytes_billed expressed in TiB, rounded to 6 dp.
      - name: total_slot_ms
        description: Total slot milliseconds — basis for editions/reserved cost.
      - name: reservation_id
        description: >
          Reservation the job ran in, or null for on-demand jobs. In 'auto'
          pricing mode this decides how the row is costed.
      - name: cache_hit
        description: True when the job was served from cache (zero cost).
      - name: cost_usd
        description: >
          Estimated job cost in USD, rounded to 6 dp. In 'auto' mode each job is
          priced by whether it ran in a reservation (null reservation_id →
          on-demand bytes, otherwise slot-based); 'on_demand'/'editions' force one.
        tests:
          - not_null
      - name: pricing_model
        description: >
          Pricing basis applied to this row — 'on_demand' or 'editions'. In 'auto'
          mode it reflects the per-job decision from reservation_id.
        tests:
          - not_null
          - accepted_values:
              values: ['on_demand', 'editions']
      - name: user_email
        description: Identity that ran the job.
      - name: destination_dataset
        description: Destination dataset id, if any.
      - name: destination_table
        description: Destination table id, if any.
      - name: error_message
        description: Error message if the job failed, otherwise null.
      - name: is_error
        description: True when the job failed.
