version: 2

models:
  - name: stg_bigquery__job_history
    description: >
      One row per BigQuery query job, read incrementally from
      INFORMATION_SCHEMA.JOBS and partitioned by day on created_at. dbt labels
      (invocation id, model name, node id) are extracted from the job labels
      array. Rows are retained even when model-level labels are absent, so Penny
      can run before the consumer project has configured +labels.
    tests:
      # Source-freshness style check: warn if no jobs have landed in the last day.
      - dbt_utils.recency:
          datepart: day
          field: created_at
          interval: 1
          config:
            severity: warn
    columns:
      - name: job_id
        description: BigQuery job id. Unique per job within the project/region.
        tests:
          - not_null
          - unique
      - name: created_at
        description: Job creation timestamp (INFORMATION_SCHEMA.creation_time). Partition key.
        tests:
          - not_null
      - name: completed_at
        description: Job end timestamp (INFORMATION_SCHEMA.end_time).
      - name: execution_time_seconds
        description: Wall-clock execution time in seconds, derived from end_time - start_time.
      - name: total_bytes_processed
        description: Total bytes processed by the job (not necessarily billed).
      - name: total_bytes_billed
        description: Total bytes billed — the basis for on-demand cost.
      - name: total_slot_ms
        description: Total slot milliseconds consumed — the basis for editions/reserved cost.
      - name: reservation_id
        description: >
          Reservation the job ran in, or null for on-demand jobs. Drives per-job
          pricing in 'auto' mode (null → on-demand bytes, set → slot-based).
      - name: cache_hit
        description: True when the query result was served from cache (zero bytes billed).
      - name: destination_project
        description: Project id of the job's destination table, if any.
      - name: destination_dataset
        description: Dataset id of the job's destination table, if any.
      - name: destination_table
        description: >
          Table id of the job's destination table. Used as the model-name
          fallback when dbt_model_name is not labelled.
      - name: user_email
        description: Identity (user or service account) that ran the job.
      - name: error_message
        description: Error message if the job failed, otherwise null.
      - name: dbt_invocation_id
        description: >
          dbt invocation id from job labels. Present on all dbt jobs and used to
          group an entire dbt run together.
        tests:
          - not_null:
              config:
                # Only guaranteed non-null when penny_dbt_only filters to dbt jobs.
                severity: warn
      - name: dbt_model_name
        description: >
          dbt model name from job labels (this.name). Null until the consumer
          project configures +labels.
      - name: dbt_node_id
        description: >
          dbt node unique id from job labels. Prefers Penny's dbt_node_id label,
          falling back to the standard node_id label that dbt's default
          query-comment emits under job-label: true. Null when neither is present.
